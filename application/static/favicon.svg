<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Finance Candle">
  <defs>
    <linearGradient id="fcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bf0"/>
      <stop offset="1" stop-color="#6d5ce0"/>
    </linearGradient>
    <linearGradient id="fcGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d17f"/>
      <stop offset="1" stop-color="#1f9d5b"/>
    </linearGradient>
    <linearGradient id="fcRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0523f"/>
      <stop offset="1" stop-color="#c92c1c"/>
    </linearGradient>
    <linearGradient id="fcTrend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8e8ee"/>
      <stop offset="1" stop-color="#b9bcc9"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#fcBg)"/>

  <!-- Green up candle (left) -->
  <g fill="url(#fcGreen)">
    <rect x="150" y="150" width="70" height="212" rx="10"/>
    <rect x="176" y="96" width="18" height="320" rx="9"/>
  </g>

  <!-- Red down candle (right) -->
  <g fill="url(#fcRed)">
    <rect x="292" y="150" width="70" height="212" rx="10"/>
    <rect x="318" y="96" width="18" height="320" rx="9"/>
  </g>

  <!-- Rising trend line -->
  <path d="M150 356 L232 288 L280 312 L392 200"
        fill="none" stroke="url(#fcTrend)" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
