{% extends "layout.html" %}
{% block content %}
<div class="scope-wrapper">
  <header class="scope-header">
    <h1 class="scope-title"><i class="fa-solid fa-table-cells-large me-2"></i>Sector Scope</h1>
    <button id="refreshBtn" class="scope-refresh-btn" title="Refresh data">
      <i class="fa-solid fa-arrows-rotate"></i>
    </button>
  </header>

  <div id="treemapLoading" class="scope-loading">
    <div class="spinner-border text-primary" role="status"></div>
    <p>Loading sector data…</p>
  </div>

  <div id="treemapContainer" class="scope-treemap" hidden></div>

  <!-- Sector performance bar chart -->
  <div id="sectorBarsWrap" class="scope-bars-wrap" hidden>
    <div class="scope-bars-header">
      <span class="scope-bars-title"><i class="fa-solid fa-chart-simple me-2"></i>Sector Performance — Avg % Change</span>
      <span class="scope-bars-legend">
        <span><span class="legend-sw" style="background:#22c55e"></span>Net Buying</span>
        <span><span class="legend-sw" style="background:#dc2626"></span>Net Selling</span>
      </span>
    </div>
    <div id="sectorBars" class="scope-bars"></div>
  </div>
</div>

<!-- Floating tooltip -->
<div id="stockTooltip" class="scope-tooltip" hidden></div>

<style>
/* ── Sector Scope – light full-page treemap ──────────────────── */
.scope-wrapper{background:#fff;border-radius:12px;padding:0;display:flex;flex-direction:column;min-height:calc(100vh - 90px);border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.scope-header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid #e2e8f0;flex-shrink:0}

/* Override app-content constraints so treemap fills the full page width */
.app-content:has(.scope-wrapper) { max-width: 100%; padding: 0; margin: 0; }
.scope-wrapper { border-radius: 0; border: none; height: auto; min-height: calc(100vh - var(--topbar-height) - 20px); box-shadow: none; margin-bottom: 20px }
.scope-title{color:#0f172a;font-size:1.1rem;font-weight:800;margin:0}
.scope-refresh-btn{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;width:34px;height:34px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.scope-refresh-btn:hover{background:#e2e8f0;color:#0f172a}
.scope-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:#64748b;gap:12px;min-height:600px}
.scope-treemap{position:relative;flex:1 1 auto;min-height:calc(100vh - var(--topbar-height) - 80px);overflow:hidden;border-radius:0 0 12px 12px}

/* Sector bar chart */
.scope-bars-wrap{flex-shrink:0;border-top:1px solid #e2e8f0;background:#fff;padding:18px 24px 22px}
.scope-bars-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.scope-bars-title{font-size:1.05rem;font-weight:800;color:#0f172a}
.scope-bars-legend{display:flex;gap:16px;font-size:.82rem;color:#64748b;font-weight:600}
.legend-sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:middle}
.scope-bars{position:relative;display:flex;align-items:flex-end;justify-content:space-around;gap:10px;height:760px;padding:48px 4px 0;border-top:1px dashed #cbd5e1;overflow-x:auto;overflow-y:hidden}
.scope-bar-col{flex:1 1 0;min-width:80px;max-width:140px;display:flex;flex-direction:column;align-items:center;height:100%;position:relative}
.scope-bar-track{position:relative;width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
.scope-bar-axis{position:absolute;left:0;right:0;top:50%;border-top:1px solid #cbd5e1}
.scope-bar{width:60%;max-width:64px;border-radius:6px 6px 0 0;position:absolute;left:50%;transform:translateX(-50%);transition:height .3s ease;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:.7rem;font-weight:700;padding-top:3px;box-shadow:0 -2px 6px rgba(0,0,0,.05)}
.scope-bar.neg{border-radius:0 0 6px 6px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.scope-bar-label{font-size:.78rem;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;text-align:center;line-height:1.15;margin-top:10px;padding:0 2px}
.scope-bar-val{position:absolute;font-size:.82rem;font-weight:800;color:#0f172a;white-space:nowrap}

/* Sector block */
.scope-sector{position:absolute;overflow:hidden;border:2px solid rgba(255,255,255,.7)}
.scope-sector-label{position:absolute;top:0;left:0;padding:4px 10px;font-size:.82rem;font-weight:900;color:#fff;z-index:5;pointer-events:none;text-transform:uppercase;letter-spacing:.05em;background:rgba(0,0,0,.55);border-radius:0 0 6px 0;line-height:1.3;white-space:nowrap}

/* Stock cell */
.scope-cell{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;border:1px solid rgba(255,255,255,.25);transition:filter .12s}
.scope-cell:hover{filter:brightness(1.18);z-index:10}
.scope-cell-name{color:#fff;font-size:.78rem;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%;text-align:center;line-height:1.2}
.scope-cell-name-sm{font-size:.62rem}
.scope-cell-change{color:rgba(255,255,255,.88);font-size:.65rem;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.6);margin-top:1px}

/* Floating tooltip */
.scope-tooltip{position:fixed;background:#fff;color:#0f172a;padding:12px 16px;border-radius:10px;border:1px solid #e2e8f0;font-size:.84rem;pointer-events:none;z-index:9999;box-shadow:0 8px 30px rgba(15,23,42,.12);max-width:250px}
.scope-tooltip b{display:block;font-size:.9rem;margin-bottom:5px;color:#4f46e5}
.scope-tooltip .tt-row{display:flex;justify-content:space-between;gap:18px;margin:3px 0}
.scope-tooltip .tt-label{color:#64748b}
.scope-tooltip .tt-val{font-weight:700}
.scope-tooltip .tt-pos{color:#16a34a}
.scope-tooltip .tt-neg{color:#dc2626}

/* ── Sector Scope – dark mode overrides ──────────────────────── */
[data-theme="dark"] .scope-wrapper{background:var(--surface);border-color:var(--border)}
[data-theme="dark"] .scope-header{border-color:var(--border)}
[data-theme="dark"] .scope-title{color:var(--text)}
[data-theme="dark"] .scope-refresh-btn{background:var(--surface-2);color:var(--text-muted);border-color:var(--border)}
[data-theme="dark"] .scope-refresh-btn:hover{background:var(--border);color:var(--text)}
[data-theme="dark"] .scope-loading{color:var(--text-muted)}
[data-theme="dark"] .scope-bars-wrap{background:var(--surface);border-color:var(--border)}
[data-theme="dark"] .scope-bars-title{color:var(--text)}
[data-theme="dark"] .scope-bars-legend{color:var(--text-muted)}
[data-theme="dark"] .scope-bars{border-color:var(--border-strong)}
[data-theme="dark"] .scope-bar-axis{border-color:var(--border-strong)}
[data-theme="dark"] .scope-bar-label{color:var(--text-muted)}
[data-theme="dark"] .scope-bar-val{color:var(--text)}
[data-theme="dark"] .scope-tooltip{background:var(--surface);color:var(--text);border-color:var(--border-strong);box-shadow:0 8px 30px rgba(0,0,0,.35)}
[data-theme="dark"] .scope-tooltip b{color:var(--primary)}
[data-theme="dark"] .scope-tooltip .tt-label{color:var(--text-muted)}
[data-theme="dark"] .scope-tooltip .tt-pos{color:var(--success)}
[data-theme="dark"] .scope-tooltip .tt-neg{color:var(--danger)}
[data-theme="dark"] .scope-sector{border-color:rgba(0,0,0,.4)}
[data-theme="dark"] .scope-cell{border-color:rgba(0,0,0,.3)}
</style>

<script>
/* ── colour scale ──────────────────────────────────────────────── */
function getColor(c) {
    if (c >= 3)   return '#22c55e';
    if (c >= 2)   return '#2da84d';
    if (c >= 1)   return '#2d8a44';
    if (c >= 0.5) return '#3a7d46';
    if (c > 0)    return '#4a7a4f';
    if (c === 0)  return '#9ca3af';
    if (c > -0.5) return '#b35555';
    if (c > -1)   return '#c04040';
    if (c > -2)   return '#c93535';
    if (c > -3)   return '#d42828';
    return '#e01b1b';
}

/* ── squarified treemap layout ────────────────────────────────── */
function worstRatio(row, totalArea, side) {
    if (!row.length) return Infinity;
    const rw = totalArea / side;
    let worst = 0;
    for (const it of row) {
        const h = it.area / rw;
        const r = Math.max(rw / h, h / rw);
        if (r > worst) worst = r;
    }
    return worst;
}

function squarify(items, rect, out) {
    if (!items.length) return;
    if (rect.w < 1 || rect.h < 1) { items.forEach(i => out.push({...i, x:rect.x, y:rect.y, w:0, h:0})); return; }
    if (items.length === 1) { out.push({...items[0], x:rect.x, y:rect.y, w:rect.w, h:rect.h}); return; }

    const horiz = rect.w >= rect.h;
    const side = horiz ? rect.h : rect.w;

    let row = [items[0]], rowArea = items[0].area;
    let best = worstRatio(row, rowArea, side);

    for (let i = 1; i < items.length; i++) {
        const testRow = [...row, items[i]];
        const testArea = rowArea + items[i].area;
        const r = worstRatio(testRow, testArea, side);
        if (r <= best) { row.push(items[i]); rowArea = testArea; best = r; }
        else break;
    }

    const rowWidth = rowArea / side;
    let off = 0;
    for (const it of row) {
        const sz = it.area / rowWidth;
        if (horiz) { out.push({...it, x:rect.x, y:rect.y + off, w:rowWidth, h:sz}); }
        else       { out.push({...it, x:rect.x + off, y:rect.y, w:sz, h:rowWidth}); }
        off += sz;
    }

    const rest = items.slice(row.length);
    if (!rest.length) return;
    const nr = horiz
        ? {x:rect.x + rowWidth, y:rect.y, w:rect.w - rowWidth, h:rect.h}
        : {x:rect.x, y:rect.y + rowWidth, w:rect.w, h:rect.h - rowWidth};
    squarify(rest, nr, out);
}

/* ── tooltip ──────────────────────────────────────────────────── */
const tip = document.getElementById('stockTooltip');
function showTip(e) {
    const d = e.currentTarget.dataset;
    const ch = parseFloat(d.change);
    const sign = ch >= 0 ? '+' : '';
    const cls  = ch >= 0 ? 'tt-pos' : 'tt-neg';
    tip.innerHTML = `<b>${d.name}</b>
        <div class="tt-row"><span class="tt-label">Symbol</span><span class="tt-val">${d.symbol}</span></div>
        <div class="tt-row"><span class="tt-label">Price</span><span class="tt-val">₹${Number(d.price).toLocaleString('en-IN')}</span></div>
        <div class="tt-row"><span class="tt-label">Change</span><span class="tt-val ${cls}">${sign}${ch}%</span></div>
        <div class="tt-row"><span class="tt-label">Sector</span><span class="tt-val">${d.sector}</span></div>`;
    tip.hidden = false;
    moveTip(e);
}
function moveTip(e) { tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; }
function hideTip()  { tip.hidden = true; }

/* ── render ───────────────────────────────────────────────────── */
function renderTreemap(data) {
    const box = document.getElementById('treemapContainer');
    box.hidden = false;
    box.innerHTML = '';
    const W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;

    /* level 1: sectors */
    const secs = data.sectors.map(s => ({...s, value: s.totalMcap, area: 0}));
    secs.sort((a, b) => b.value - a.value);
    const totalVal = secs.reduce((s, d) => s + d.value, 0);
    const totalArea = W * H;
    secs.forEach(s => { s.area = (s.value / totalVal) * totalArea; });

    const secRects = [];
    squarify(secs, {x:0, y:0, w:W, h:H}, secRects);

    secRects.forEach(sr => {
        const sd = document.createElement('div');
        sd.className = 'scope-sector';
        sd.style.cssText = `left:${sr.x}px;top:${sr.y}px;width:${sr.w}px;height:${sr.h}px`;

        /* sector label */
        const lbl = document.createElement('div');
        lbl.className = 'scope-sector-label';
        lbl.textContent = sr.name;
        sd.appendChild(lbl);

        /* level 2: stocks within sector */
        const stks = sr.stocks.map(s => ({...s, value: s.mcap, area: 0}));
        stks.sort((a, b) => b.value - a.value);
        const secTotal = stks.reduce((s, d) => s + d.value, 0);
        const secArea = sr.w * sr.h;
        stks.forEach(s => { s.area = (s.value / secTotal) * secArea; });

        const stkRects = [];
        squarify(stks, {x:0, y:0, w:sr.w, h:sr.h}, stkRects);

        stkRects.forEach(st => {
            const cell = document.createElement('div');
            cell.className = 'scope-cell';
            cell.style.cssText = `left:${st.x}px;top:${st.y}px;width:${st.w}px;height:${st.h}px;background:${getColor(st.change)}`;

            /* text sizing based on cell area */
            if (st.w > 60 && st.h > 44) {
                cell.innerHTML = `<span class="scope-cell-name">${st.symbol}</span><span class="scope-cell-change">${st.change > 0 ? '+' : ''}${st.change}%</span>`;
            } else if (st.w > 34 && st.h > 22) {
                const abbr = st.symbol.length > 5 ? st.symbol.slice(0, 5) + '…' : st.symbol;
                cell.innerHTML = `<span class="scope-cell-name scope-cell-name-sm">${abbr}</span>`;
            }

            cell.dataset.name   = st.name;
            cell.dataset.symbol = st.symbol;
            cell.dataset.price  = st.price;
            cell.dataset.change = st.change;
            cell.dataset.sector = sr.name;

            cell.addEventListener('mouseenter', showTip);
            cell.addEventListener('mousemove', moveTip);
            cell.addEventListener('mouseleave', hideTip);
            sd.appendChild(cell);
        });

        box.appendChild(sd);
    });

    renderSectorBars(data.sectors);
}

/* ── sector performance bar chart ─────────────────────────── */
function renderSectorBars(sectors) {
    const wrap = document.getElementById('sectorBarsWrap');
    const bars = document.getElementById('sectorBars');
    if (!sectors || !sectors.length) { wrap.hidden = true; return; }

    // Compute avg % change per sector (proxy for net buying/selling)
    const data = sectors.map(s => {
        const stocks = s.stocks || [];
        const avg = stocks.length ? stocks.reduce((sum, st) => sum + (st.change || 0), 0) / stocks.length : 0;
        return { name: s.name, avg: +avg.toFixed(2), count: stocks.length };
    }).sort((a, b) => b.avg - a.avg);

    const maxAbs = Math.max(0.5, ...data.map(d => Math.abs(d.avg)));
    const half = 300; // half-height of bar area in px

    bars.innerHTML = data.map(d => {
        const h = Math.max(2, (Math.abs(d.avg) / maxAbs) * half);
        const isPos = d.avg >= 0;
        const color = isPos ? '#22c55e' : '#dc2626';
        const sign = isPos ? '+' : '';
        // bar positioned from center axis upward (pos) or downward (neg)
        const barStyle = isPos
            ? `bottom:50%;height:${h}px;background:${color}`
            : `top:50%;height:${h}px;background:${color}`;
        const valTop = isPos ? `bottom:calc(50% + ${h + 4}px)` : `top:calc(50% + ${h + 4}px)`;
        return `<div class="scope-bar-col" title="${d.name}: ${sign}${d.avg}% (${d.count} stocks)">
            <div class="scope-bar-track">
                <div class="scope-bar-axis"></div>
                <div class="scope-bar ${isPos ? '' : 'neg'}" style="${barStyle}"></div>
                <div class="scope-bar-val" style="${valTop};color:${color}">${sign}${d.avg}%</div>
            </div>
            <div class="scope-bar-label">${d.name}</div>
        </div>`;
    }).join('');

    wrap.hidden = false;
}

/* ── caching + loading ────────────────────────────────────────── */
const CK = 'scope_cache', CT = 'scope_cache_ts', TTL = 15 * 60 * 1000;

function cacheGet() {
    try {
        const d = localStorage.getItem(CK), t = localStorage.getItem(CT);
        if (d && t && Date.now() - parseInt(t) < TTL) return JSON.parse(d);
    } catch {}
    return null;
}
function cacheSet(d) { localStorage.setItem(CK, JSON.stringify(d)); localStorage.setItem(CT, Date.now().toString()); }
function cacheClear() { localStorage.removeItem(CK); localStorage.removeItem(CT); }

function load() {
    const ld = document.getElementById('treemapLoading');
    const box = document.getElementById('treemapContainer');
    ld.style.display = 'flex'; box.hidden = true;

    const cached = cacheGet();
    if (cached) {
        ld.style.display = 'none';
        renderTreemap(cached);
        const ts = parseInt(localStorage.getItem(CT));
        if (Date.now() - ts > 5 * 60 * 1000) fetchFresh(false);
        return;
    }
    fetchFresh(true);
}

function fetchFresh(showLoader) {
    fetch('/heatmap-data').then(r => r.json()).then(d => {
        cacheSet(d);
        if (showLoader) document.getElementById('treemapLoading').style.display = 'none';
        renderTreemap(d);
    });
}

document.getElementById('refreshBtn').addEventListener('click', () => {
    cacheClear();
    document.getElementById('treemapLoading').style.display = 'flex';
    document.getElementById('treemapContainer').hidden = true;
    fetch('/heatmap-data?force_refresh=1').then(r => r.json()).then(d => {
        cacheSet(d);
        document.getElementById('treemapLoading').style.display = 'none';
        renderTreemap(d);
    });
});

/* resize handling */
let resizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        const d = cacheGet();
        if (d) renderTreemap(d);
    }, 250);
});

load();
</script>
{% endblock %}
