{% extends "guest_layout.html" %}
{% block content %}
<style>
.auth-forgot-link{font-size:.85rem;color:#C7CAFF;font-weight:600;text-decoration:none}
.auth-forgot-link:hover{color:#fff;text-decoration:underline}
</style>
<div class="auth-card">
    <div class="auth-card-header">
        <h2>Welcome back</h2>
        <p>Sign in to your portfolio dashboard</p>
    </div>

    {% if error %}
    <div class="alert alert-danger" role="alert"><i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('logIn') }}" class="auth-form" novalidate>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required autofocus />
            <label for="email"><i class="fa-solid fa-envelope me-1"></i> Email</label>
        </div>
        <div class="form-floating mb-2 password-field">
            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required />
            <label for="password"><i class="fa-solid fa-lock me-1"></i> Password</label>
            <button type="button" class="password-toggle" onclick="(function(b){var i=document.getElementById('password');var on=i.type==='password';i.type=on?'text':'password';b.innerHTML=on?'<i class=\'fa-solid fa-eye-slash\'></i>':'<i class=\'fa-solid fa-eye\'></i>';})(this)" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Sign in <i class="fa-solid fa-arrow-right ms-1"></i></button>
    </form>

    <div class="text-center mt-3">
        <a href="{{ url_for('forgot_password') }}" class="auth-forgot-link">Forgot password?</a>
    </div>

    <div class="auth-divider"><span>New here?</span></div>
    <a href="{{ url_for('signup') }}" class="btn btn-outline-primary auth-secondary">Create an account</a>
</div>
{% endblock %}
