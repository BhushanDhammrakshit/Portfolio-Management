{% extends "layout.html" %}
{% block content %}
<div class="gm-page">
  <header class="gm-header">
    <div class="gm-header-left">
      <h1 class="gm-title">Global Markets</h1>
      <p class="gm-subtitle">World indices with local market session status.</p>
    </div>
    <div class="gm-header-tools">
      <span id="gmUpdated" class="gm-updated"></span>
      <label class="gm-live-toggle" title="Auto-refresh every 60s">
        <input type="checkbox" id="gmLiveToggle" checked>
        <span class="gm-live-dot" id="gmLiveDot"></span>Live
      </label>
      <button id="gmRefreshBtn" class="gm-refresh-btn" title="Refresh now">
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>
    </div>
  </header>

  <div id="gmLoading" class="gm-loading">
    <div class="app-spinner lg text-primary" role="status" aria-label="Loading"></div>
    <p>Loading global markets…</p>
  </div>

  <div id="gmContent" hidden>
    <!-- Hero row: sentiment + advance/decline + movers -->
    <section class="gm-hero">
      <div class="gm-hero-card gm-banner" id="gmBanner">
        <div class="gm-banner-emoji" id="gmSentEmoji"></div>
        <div class="gm-banner-text">
          <div class="gm-banner-eyebrow">Global Sentiment</div>
          <div class="gm-banner-headline">
            <span class="gm-state-badge" id="gmStateBadge">NEUTRAL</span>
            <span class="gm-banner-label" id="gmSentLabel">Mixed / Neutral</span>
          </div>
          <div class="gm-banner-meta" id="gmSentMeta"></div>
          <div class="gm-breadth-bar" title="Advancing vs declining">
            <span class="gm-breadth-up"   id="gmBarUp"   style="flex:0"></span>
            <span class="gm-breadth-flat" id="gmBarFlat" style="flex:0"></span>
            <span class="gm-breadth-down" id="gmBarDown" style="flex:0"></span>
          </div>
          <div class="gm-breadth-legend">
            <span><i class="dot up"></i>Advancing <b id="gmStatUp">0</b></span>
            <span><i class="dot flat"></i>Flat <b id="gmStatFlat">0</b></span>
            <span><i class="dot down"></i>Declining <b id="gmStatDown">0</b></span>
          </div>
        </div>
      </div>

      <div class="gm-hero-card gm-mover-card up" id="gmTopGainer">
        <div class="gm-mover-eyebrow"><i class="fa-solid fa-arrow-trend-up"></i> Top Gainer</div>
        <div class="gm-mover-flag"></div>
        <div class="gm-mover-name">—</div>
        <div class="gm-mover-sub">—</div>
        <div class="gm-mover-pct">—</div>
      </div>
      <div class="gm-hero-card gm-mover-card down" id="gmTopLoser">
        <div class="gm-mover-eyebrow"><i class="fa-solid fa-arrow-trend-down"></i> Top Laggard</div>
        <div class="gm-mover-flag"></div>
        <div class="gm-mover-name">—</div>
        <div class="gm-mover-sub">—</div>
        <div class="gm-mover-pct">—</div>
      </div>
    </section>

    <!-- Idea -->
    <section class="gm-idea-card">
      <div class="gm-idea-icon"><i class="fa-solid fa-lightbulb"></i></div>
      <div class="gm-idea-body">
        <div class="gm-idea-title">Today's Idea</div>
        <div class="gm-idea-text" id="gmIdeaText">—</div>
      </div>
    </section>

    <!-- Regions -->
    <nav id="gmRegionTabs" class="global-region-tabs" role="tablist" aria-label="Global market regions"></nav>
    <section id="gmRegions" class="gm-regions"></section>
  </div>
</div>


<script>
(function(){
  const $ = (id) => document.getElementById(id);
  let timer = null;

  function fmtPct(v){
    if (v === null || v === undefined || isNaN(v)) return "N/A";
    return window.FCFormat.percent(+v, true);
  }
  function fmtPrice(v){
    if (v === null || v === undefined || isNaN(v)) return "N/A";
    const n = +v;
    return n > 0 ? window.FCFormat.number(n, 2) : "N/A";
  }
  function classOf(pct){
    if (pct > 0.05) return "up";
    if (pct < -0.05) return "down";
    return "flat";
  }

  function escapeHTML(s){
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }

  // Mini markdown for **bold** in idea text
  function renderIdea(s){
    return escapeHTML(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  function render(data){
    if (!data || !Array.isArray(data.regions)) throw new Error("Invalid global markets payload");
    if (!data.regions.length) {
      $("gmLoading").innerHTML = "<p role=\"status\">No global market data is available.</p>";
      return;
    }

    const sent = data.sentiment || {};
    const banner = $("gmBanner");
    banner.classList.remove("bull","bear","neutral");
    banner.classList.add(sent.tone || "neutral");
    $("gmSentEmoji").textContent = "";
    $("gmSentLabel").textContent = sent.label || "—";
    const openCount = (data.stats || {}).open_count || 0;
    const openSuffix = openCount > 0
      ? ` · <span class="gm-live-pill sm" title="${openCount} ${openCount === 1 ? "market is" : "markets are"} currently open"><span class="gm-live-pulse"></span>${openCount} LIVE</span>`
      : "";
    const breadthValue = Number(sent.breadth_pct);
    const breadth = sent.breadth_pct == null || !Number.isFinite(breadthValue)
      ? window.FCFormat.missing('Market breadth is unavailable')
      : `${window.FCFormat.percent(breadthValue,false)} green`;
    $("gmSentMeta").innerHTML = `Avg ${fmtPct(sent.avg_pct)} · Breadth ${breadth}${openSuffix}`;

    const stateBadge = $("gmStateBadge");
    if (stateBadge){
      stateBadge.classList.remove("bull","bear","neutral");
      stateBadge.classList.add(sent.tone || "neutral");
      stateBadge.textContent = sent.state || "NEUTRAL";
    }

    const stats = data.stats || {};
    $("gmStatUp").textContent = stats.up ?? 0;
    $("gmStatDown").textContent = stats.down ?? 0;
    $("gmStatFlat").textContent = stats.flat ?? 0;

    // Breadth stacked bar
    const total = (stats.up || 0) + (stats.down || 0) + (stats.flat || 0);
    if (total > 0){
      $("gmBarUp").style.flex   = String(stats.up   || 0);
      $("gmBarFlat").style.flex = String(stats.flat || 0);
      $("gmBarDown").style.flex = String(stats.down || 0);
    }

    $("gmIdeaText").innerHTML = renderIdea(data.idea || "");

    if (stats.top_gainer){
      const g = stats.top_gainer;
      const card = $("gmTopGainer");
      card.querySelector(".gm-mover-flag").textContent = "";
      card.querySelector(".gm-mover-name").textContent = g.country || "";
      card.querySelector(".gm-mover-sub").textContent  = `${g.index || ""} · ${fmtPrice(g.price)}`;
      card.querySelector(".gm-mover-pct").textContent  = fmtPct(g.change_pct);
    }
    if (stats.top_loser){
      const l = stats.top_loser;
      const card = $("gmTopLoser");
      card.querySelector(".gm-mover-flag").textContent = "";
      card.querySelector(".gm-mover-name").textContent = l.country || "";
      card.querySelector(".gm-mover-sub").textContent  = `${l.index || ""} · ${fmtPrice(l.price)}`;
      card.querySelector(".gm-mover-pct").textContent  = fmtPct(l.change_pct);
    }

    const regions = data.regions || [];
    const labels = { "Asia-Pacific": "Asia" };
    $("gmRegionTabs").innerHTML = regions.map((region, index) =>
      `<button type="button" role="tab" id="gm-tab-${index}" aria-controls="gm-panel-${index}" aria-selected="${index === 0}" data-region-index="${index}">${escapeHTML(labels[region.name] || region.name)}</button>`
    ).join("");
    $("gmRegions").innerHTML = regions.map((region, index) => {
      const rows = (region.items || []).map(item => {
        const cls = classOf(item.change_pct);
        const session = item.session ? ` title="${escapeHTML(item.session)}"` : "";
        const status = item.is_open ? "Open" : "Closed";
        return `<tr class="gm-card ${cls}">
          <td class="gm-card-country">${escapeHTML(item.country || "N/A")}</td>
          <td class="gm-card-index">${escapeHTML(item.index || "N/A")}</td>
          <td class="gm-card-price">${fmtPrice(item.price)}</td>
          <td class="gm-card-pct">${fmtPct(item.change_pct)}</td>
          <td class="gm-card-status"${session}>${status}</td>
          <td class="gm-card-spark"><span class="market-na" title="Historical series is not available from this quote feed">N/A</span></td>
        </tr>`;
      }).join("");
      return `<section class="gm-region" id="gm-panel-${index}" role="tabpanel" aria-labelledby="gm-tab-${index}" data-region-panel="${index}"${index ? " hidden" : ""}>
        <div class="gm-region-grid"><table class="market-table gm-market-table">
          <thead><tr><th>Market</th><th>Index</th><th>Value</th><th>Change</th><th>Status</th><th>Trend</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6">No index data available.</td></tr>'}</tbody>
        </table></div>
      </section>`;
    }).join("");
    $("gmRegionTabs").querySelectorAll("[data-region-index]").forEach(tab => {
      tab.addEventListener("click", () => {
        const selected = tab.dataset.regionIndex;
        $("gmRegionTabs").querySelectorAll("[data-region-index]").forEach(item => {
          item.setAttribute("aria-selected", String(item === tab));
          item.tabIndex = item === tab ? 0 : -1;
        });
        $("gmRegions").querySelectorAll("[data-region-panel]").forEach(panel => {
          panel.hidden = panel.dataset.regionPanel !== selected;
        });
      });
      tab.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        const tabs = Array.from($("gmRegionTabs").querySelectorAll("[data-region-index]"));
        const index = tabs.indexOf(tab);
        const next = tabs[(index + (event.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
        event.preventDefault();
        next.focus();
        next.click();
      });
    });

    if (data.ts){
      const d = new Date(data.ts * 1000);
      $("gmUpdated").textContent = `Updated ${window.FCFormat.time(d)}`;
    }

    $("gmLoading").hidden = true;
    $("gmContent").hidden = false;
  }

  async function load(force, options){
    options = options || {};
    const silent = !!options.silent;
    const suppressErrors = !!options.suppressErrors;
    const snapshotOnly = !!options.snapshotOnly;
    try {
      const params = new URLSearchParams();
      if (force) params.set('refresh', '1');
      if (snapshotOnly) params.set('snapshot', '1');
      const query = params.toString();
      const url = `/api/global-markets${query ? '?' + query : ''}`;
      const resp = await fetch(url, {credentials: "same-origin"});
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      if (data && data.snapshot_missing) return false;
      try { ppCache.set('globalmarkets:data', data); } catch(e) {}
      render(data);
      return true;
    } catch (e){
      if (!suppressErrors && $("gmContent").hidden) {
        console.error("global-markets load failed", e);
        $("gmLoading").innerHTML =
          '<p role="alert">Global market data could not be loaded. Use Refresh to retry.</p>';
      }
      return false;
    }
  }

  function startTimer(){
    stopTimer();
    timer = setInterval(() => load(false, {silent: true, suppressErrors: true}), 60000);
  }
  function stopTimer(){
    if (timer){ clearInterval(timer); timer = null; }
  }

  document.addEventListener("DOMContentLoaded", async () => {
    // Stale-while-revalidate init
    let hasCached = false;
    try {
      const entry = ppCache.getEntry('globalmarkets:data');
      if (entry && entry.v && entry.v.regions) {
        render(entry.v);
        hasCached = true;
      }
    } catch(e) {}
    const snapshotLoaded = await load(false, { snapshotOnly: true, silent: hasCached, suppressErrors: true });
    await load(false, { silent: hasCached || snapshotLoaded, suppressErrors: hasCached || snapshotLoaded });
    const lt = $("gmLiveToggle");
    if (lt){
      lt.addEventListener("change", (e) => e.target.checked ? startTimer() : stopTimer());
      if (lt.checked) startTimer();
    }
    const rb = $("gmRefreshBtn");
    if (rb) rb.addEventListener("click", () => load(true));
  });
})();
</script>
{% endblock %}
